[server]
debug = true
log_level = "info"

[network]
game_port = 43594
web_port = 8081 #for ktor api not web clinet
web_enabled = true
connections_per_ip = 5
connection_timeout = 30000
packet_limit = 100
leak_detection = "disabled"

[world]
max_players = 2000
global_xp_multiplier = 1

[features]
trading = true
dueling = true
pvp = true
dropping = true
banking = true
shopping = true
public_chat_yell = true

[database_pool]
min_size = 5
max_size = 20
connection_timeout = 30000
idle_timeout = 600000
max_lifetime = 1800000

[ranks]
banned_group_id = 3
mod_group_ids = [5, 9]
admin_group_ids = [6, 10, 18, 35]
debug_bypass_group_ids = [11, 34, 40]

[metrics]
enabled = true
prometheus_endpoint = true
dashboard_enabled = true

[discord]
require_verified_email = false #can be changed if we have issues with abuse

[web_security]
allowed_origins = []
trusted_proxy_cidrs = []
