schema_version = 1

# Prayer level/drain/mutual-exclusion data, ported from the legacy PrayerManager.Prayer enum
# (engine/systems/skills/prayer/PrayerManager.kt) - that enum still exists but now only owns
# the persisted `VALUES`/`forButton` lookup used by save/load. level = -1 means no level
# requirement. config_id is the legacy client varbit id (same kind of protocol-level plugin
# data as SkillPrayer.buttonId), needed to clear the button highlight on a refused toggle.
# The 6 boolean flags mirror the legacy bitmask categories (OVERHEAD/ATTACK/STRENGTH/RANGE/
# MAGIC/DEFENCE) used for the mutual-exclusion cascade: activating a prayer deactivates any
# other active prayer sharing a flag with it.

